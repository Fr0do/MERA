group: mmred
group_alias: MMReD Dense Context Reasoning
task:
  - group: mmred_dc_sa_c
    group_alias: DC-SA-C (spend_alone)
    task:
      - mmred_dc_sa_c_32
      - mmred_dc_sa_c_64
      - mmred_dc_sa_c_128
    aggregate_metric_list:
      - metric: em.dc_aggregate
        aggregation: !function utils.group_length_weighted_aggregate
        filter_list: scoring
  - group: mmred_dc_sr_i
    group_alias: DC-SR-I (steps_in_room)
    task:
      - mmred_dc_sr_i_32
      - mmred_dc_sr_i_64
      - mmred_dc_sr_i_128
    aggregate_metric_list:
      - metric: em.dc_aggregate
        aggregation: !function utils.group_length_weighted_aggregate
        filter_list: scoring
  - group: mmred_dc_cc_i
    group_alias: DC-CC-I (crowd_count)
    task:
      - mmred_dc_cc_i_32
      - mmred_dc_cc_i_64
      - mmred_dc_cc_i_128
    aggregate_metric_list:
      - metric: em.dc_aggregate
        aggregation: !function utils.group_length_weighted_aggregate
        filter_list: scoring
  - group: mmred_dc_ws_r
    group_alias: DC-WS-R (where_spend)
    task:
      - mmred_dc_ws_r_32
      - mmred_dc_ws_r_64
      - mmred_dc_ws_r_128
    aggregate_metric_list:
      - metric: em.dc_aggregate
        aggregation: !function utils.group_length_weighted_aggregate
        filter_list: scoring
  - group: mmred_dc_whs_c
    group_alias: DC-WHS-C (who_spend)
    task:
      - mmred_dc_whs_c_32
      - mmred_dc_whs_c_64
      - mmred_dc_whs_c_128
    aggregate_metric_list:
      - metric: em.dc_aggregate
        aggregation: !function utils.group_length_weighted_aggregate
        filter_list: scoring
# Top-level harness row = plain size-weighted mean over leaves (sanity only).
# The OFFICIAL MMReD headline — harmonic mean across the 5 per-type length-weighted
# subgroups — CANNOT be computed here: lm-eval flattens group-of-groups aggregation to
# leaf metrics before calling the group function, so a harmonic at this level silently
# drops the 1/2/4 length weighting (verified end-to-end). The headline is produced
# post-hoc by scripts/mmred_score.py from the per-type subgroup rows emitted below.
aggregate_metric_list:
  - metric: em.dc_aggregate
    aggregation: mean
    weight_by_size: true
    filter_list: scoring
